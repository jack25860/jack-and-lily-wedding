name: v108 message board fails loudly

# The guest-message board silently swallowed its own failure.
#
# Measured on the live site (2026-11-23):
#   * GET <endpoint>?diag=1 -> {"version":"v49"}  (the v50 deploy never took
#     effect, so the live endpoint has no saveMessage branch)
#   * POST {type:"saveMessage"} to that v49 endpoint is NOT rejected -- v49
#     falls through to its RSVP branch and appends the message as a bogus
#     guest row in A:L (verified: row 3 became "__DIAG_TEST__")
#   * v107 gated the write on diag >= v50, so it correctly refused to POST
#     (that gate is what prevents the A:L corruption) but then told the guest
#     "\u7559\u8a00\u5df2\u5148\u5b58\u5728\u6b64\u88dd\u7f6e\uff0c\u7a0d\u5f8c\u6703\u81ea\u52d5\u540c\u6b65\u3002", which reads as success. The
#     message never reached the shared sheet, so no other device could see it.
#     That is the reported bug.
#
# v108 keeps the gate and makes the failure visible:
#   - MSG_EP_STATE {checked,ok,version} replaces the one-shot MSG_EP_OK, so a
#     failed probe is retried on the next submit instead of cached forever
#   - endpoint not ready -> "\u7559\u8a00\u5df2\u986f\u793a\u5728\u6b64\u88dd\u7f6e\uff1b\u7559\u8a00\u677f\u540c\u6b65\u5c1a\u672a\u555f\u7528\uff0c\u5176\u4ed6\u88dd\u7f6e
#     \u66ab\u6642\u770b\u4e0d\u5230\u3002" (no more "will sync later")
#   - POST failed -> "\u7559\u8a00\u9001\u51fa\u5931\u6557\uff0c\u5df2\u5148\u5b58\u5728\u6b64\u88dd\u7f6e\uff0c\u7a0d\u5f8c\u6703\u81ea\u52d5\u91cd\u8a66\u3002"
#   - site-version -> v108
#
# Front-end only: no new fields, no new features. RSVP (phone / optional
# email), gallery, video and the iPhone typing-stability CSS are untouched.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v108 patch
        run: python3 scripts/v108_patch.py

      - name: Verify
        run: |
          set -e
          node --check js/app.js
          echo "app.js syntax OK"
          grep -q 'MSG_EP_STATE={checked:false,ok:false,version:""}' js/app.js
          grep -q 'MSG_EP_STATE={checked:true,ok:!!(n>=50),version:v}' js/app.js
          grep -q '\u7559\u8a00\u677f\u540c\u6b65\u5c1a\u672a\u555f\u7528' js/app.js
          grep -q '\u7559\u8a00\u9001\u51fa\u5931\u6557' js/app.js
          grep -q 'content="v108"' index.html
          echo "v108 markers OK"
          if grep -q 'MSG_EP_OK' js/app.js; then
            echo "FAIL: old MSG_EP_OK still present"; exit 1
          fi
          if grep -q '\u7559\u8a00\u5df2\u5148\u5b58\u5728\u6b64\u88dd\u7f6e' js/app.js; then
            echo "FAIL: old misleading wording still present"; exit 1
          fi
          echo "old markers fully removed"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "v108: message board reports sync failure instead of silently swallowing it"
            git push
          fi
