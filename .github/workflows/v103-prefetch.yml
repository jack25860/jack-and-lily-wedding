name: v103b prefetch trailer on approach

# Measured on the live site at 20 Mbps: click-to-first-frame was 15.3 s because
# the video request queued behind 137 gallery images. YouTube starts fetching
# the rendition as the player scrolls into view; this does the same with an
# IntersectionObserver (600 px root margin). Nothing is fetched until the
# trailer block is near the viewport.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add prefetch
        run: |
          set -e
          echo '' | base64 -d > /tmp/p3.py
          python3 /tmp/p3.py

      - name: Verify
        run: |
          set -e
          node --check js/app.js
          grep -q 'IntersectionObserver' js/app.js
          grep -q 'function prefetch()' js/app.js
          echo "verified"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "v103b: prefetch the trailer rendition as it approaches the viewport"
            git push
          fi
