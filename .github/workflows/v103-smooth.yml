name: v103 trailer smoothness (adaptive rendition + buffer gate)

# Repairs and upgrades the trailer in one atomic run.
#
# 1. Restores js/app.js from the v102 commit. An earlier commit of this change
#    wrote a placeholder into that file by mistake, so the live site currently
#    serves a 15-byte app.js. Restoring from a fixed SHA makes this idempotent.
# 2. Applies the v103 patch (base64 below, decoded at run time) so the patch
#    text cannot be mangled by YAML indentation.
# 3. Verifies, then commits. GitHub Pages redeploys from the commit.
#
# No video download and no transcode: both renditions (1080p / 720p) are
# already in the repo from v102.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore js/app.js from the v102 commit
        run: |
          set -e
          git checkout eb5c16c^ -- js/app.js
          wc -c js/app.js
          grep -q 'function initTrailer' js/app.js
          echo "app.js restored from v102"

      - name: Apply v103 patch
        run: |
          set -e
          echo '' | base64 -d > /tmp/v103_patch.py
          wc -c /tmp/v103_patch.py
          python3 /tmp/v103_patch.py

      - name: Verify
        run: |
          set -e
          grep -q 'trailer-active' js/app.js
          grep -q 'navigator.connection' js/app.js
          grep -q 'trailer-active' css/styles.css
          grep -q 'content="v103"' index.html
          node --check js/app.js
          wc -c js/app.js
          echo "patch verified"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "v103: adaptive trailer rendition + buffer-ahead gate + playback compositing relief"
            git push
          fi
