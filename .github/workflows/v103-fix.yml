name: v103 fix dangling play block

# The v103 patch left the original play() block dangling after the new buffer
# gate, which throws "p is not defined" on click. This removes exactly that
# one copy and verifies the result.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove the dangling block
        run: |
          set -e
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py

      - name: Verify
        run: |
          set -e
          node --check js/app.js
          grep -q 'function gate()' js/app.js
          grep -q 'function go()' js/app.js
          test "$(grep -o 'if(p&&p.catch)p.catch' js/app.js | wc -l)" -eq 1
          echo "verified: one play block, syntax ok"

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "v103: remove dangling play block left by the patch (fixes p is not defined)"
            git push
          fi
