<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>電子喜帖 · 循環播放｜三生三世・緣定今生</title>
<meta name="description" content="Jack &amp; Lily 的電子喜帖影片，自動循環播放。三生三世，緣定今生。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4A0E19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#6E1626; --wine-deep:#4A0E19; --wine-dark:#2A0A11;
  --ink:#131010; --ink-2:#1C1715;
  --paper:#F5F0E7; --gold:#C9A961; --gold-light:#EBDCB6;
  --grey-1:#8C8379; --line-gold:rgba(201,169,97,.34);
  --zh:"Noto Serif TC","Songti TC","PingFang TC",serif;
  --en-caps:"Cinzel","Cormorant Garamond",serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;overflow-x:hidden;min-height:100vh;
  background:var(--ink);color:var(--paper);
  font-family:var(--zh);font-weight:300;line-height:1.9;letter-spacing:.04em;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
}
body:before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(58% 52% at 78% 16%,rgba(110,22,38,.42),transparent 68%),
    radial-gradient(52% 46% at 14% 84%,rgba(74,14,25,.44),transparent 70%),
    linear-gradient(180deg,#0C0908,#131010 45%,#0C0908);
}
.page{position:relative;z-index:2;width:min(1000px,100%);padding:clamp(26px,4.4vw,52px) clamp(16px,4vw,40px) clamp(40px,6vw,72px);display:flex;flex-direction:column;align-items:center;gap:clamp(18px,2.6vw,30px)}

/* ── 頂部：印章 + 標題 ── */
.head{text-align:center;width:100%}
.seal{
  width:46px;height:46px;margin:0 auto 18px;display:grid;place-items:center;
  background:var(--wine);color:var(--gold-light);font-size:1.32rem;line-height:1;
  border-radius:4px;box-shadow:0 12px 30px -12px rgba(74,14,25,.85),0 0 0 3px rgba(110,22,38,.2),0 0 0 4px rgba(201,169,97,.32)
}
.eyebrow{
  display:inline-flex;align-items:center;gap:14px;
  font-family:var(--en-caps);font-size:.64rem;letter-spacing:.44em;text-indent:.44em;color:var(--gold)
}
.eyebrow:before,.eyebrow:after{content:"";width:clamp(20px,4vw,38px);height:1px;flex:none}
.eyebrow:before{background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow:after{background:linear-gradient(90deg,var(--gold),transparent)}
.title{margin:16px 0 0;font-weight:400;font-size:clamp(1.5rem,4.6vw,2.5rem);letter-spacing:.2em;text-indent:.2em;color:#fbf7ef;text-wrap:balance}
.rule{display:flex;justify-content:center;margin:clamp(16px,2.4vw,24px) 0 0}
.rule span{display:block;width:min(230px,52%);height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,97,.85),transparent)}
.names{margin-top:14px;font-size:clamp(.92rem,2.2vw,1.12rem);letter-spacing:.2em;color:var(--gold-light)}
.names em{font-family:var(--en-caps);font-style:normal;color:var(--gold);margin:0 .5em}

/* ── 影片框（直式 3:4，與素材一致） ── */
.frame{
  position:relative;width:min(100%,520px);margin:0 auto;
  aspect-ratio:3/4;
  background:#0e0b0a;border:1px solid rgba(201,169,97,.46);border-radius:3px;
  overflow:hidden;
  box-shadow:0 44px 96px -46px rgba(19,16,16,.95),0 0 0 1px rgba(201,169,97,.18) inset
}
.frame__video{display:block;width:100%;height:100%;object-fit:cover;background:#0e0b0a}
.frame__inner{position:absolute;inset:12px;border:1px solid rgba(201,169,97,.28);pointer-events:none}
.frame__inner:before,.frame__inner:after{content:"";position:absolute;width:26px;height:26px;border:1px solid rgba(201,169,97,.6)}
.frame__inner:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame__inner:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.badge{
  position:absolute;left:50%;bottom:clamp(12px,2.6vw,20px);transform:translateX(-50%);z-index:3;
  display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
  padding:7px 16px;border:1px solid var(--line-gold);border-radius:100px;
  background:rgba(15,12,11,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-family:var(--en-caps);font-size:.58rem;letter-spacing:.28em;text-indent:.28em;color:var(--gold-light)
}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,to{opacity:.45;transform:scale(.86)}50%{opacity:1;transform:scale(1.16)}}

/* ── 說明與操作 ── */
.note{text-align:center;max-width:44ch;font-size:clamp(.84rem,2vw,.96rem);letter-spacing:.12em;line-height:2.1;color:#f5f0e7c7}
.note strong{color:var(--gold-light);font-weight:400}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;width:100%}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;
  padding:14px 30px;border:1px solid var(--line-gold);border-radius:2px;
  font-family:var(--en-caps);font-size:.68rem;letter-spacing:.26em;text-indent:.26em;
  color:var(--gold-light);text-decoration:none;cursor:pointer;background:none;
  transition:background .5s var(--ease),color .5s,border-color .5s,transform .5s var(--ease)
}
.btn:hover{background:var(--wine);border-color:var(--wine);color:#fbf7ef;transform:translateY(-2px)}
.btn--solid{background:var(--wine);border-color:var(--wine);color:var(--gold-light)}
.btn--solid:hover{background:var(--wine-deep)}

.foot{margin-top:clamp(6px,1.6vw,14px);text-align:center;font-size:.72rem;letter-spacing:.2em;color:var(--grey-1)}
.foot a{color:var(--gold);text-decoration:underline;text-underline-offset:4px}
.foot a:hover{color:var(--gold-light)}

@media(max-width:640px){
  .frame{width:100%}
  .btn{width:100%}
  .actions{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  .badge i{animation:none}
  *{transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <div class="seal" aria-hidden="true">囍</div>
    <p class="eyebrow">E-INVITATION</p>
    <h1 class="title">電子喜帖</h1>
    <div class="rule"><span></span></div>
    <p class="names"><span>王宥岑</span><em>&amp;</em><span>杜伊穠</span></p>
  </header>

  <div class="frame">
    <video id="ecardVideo" class="frame__video"
           poster="images/ecard-video-poster.jpg"
           autoplay loop muted playsinline preload="auto"
           controlslist="nodownload" disablepictureinpicture
           aria-label="電子喜帖影片，自動循環播放並自動開啟配樂">
      <!-- 依序嘗試：MP4／H.264 + AAC（Safari、iOS、多數桌面瀏覽器）→ WebM／VP9 + Opus（VP9 系瀏覽器）。 -->
      <source src="media/ecard-video.mp4" type="video/mp4">
      <source src="media/ecard-video.webm" type="video/webm">
      您的瀏覽器不支援影片播放，請<a href="media/ecard-video.mp4">下載影片</a>觀看。
    </video>
    <div class="frame__inner" aria-hidden="true"></div>
    <span class="badge"><i aria-hidden="true"></i><span>LOOP · 循環播放</span></span>
  </div>

  <p class="note">
    三生三世，緣定今生。<br>
    <strong>影片會自動循環播放</strong>，並自動開啟配樂。
  </p>

  <div class="actions">
    <a class="btn btn--solid" href="./">← 回到婚禮網站</a>
  </div>

  <p class="foot">
    2027.04.17 &nbsp;·&nbsp; 饗婚冊宴館<br>
    若非從喜帖信件前來，請見 <a href="./">婚禮邀請網站</a>
  </p>

</div>

<script>
/* v52 影片卡住修正：任何事件（點擊／暫停／緩衝／visibility 切換／play() 失敗）都不會讓影片停止，
   並以硬性看門狗最終保底，確保影片持續循環運轉。
   音效：預設 muted=false、volume>0；頁面上不提供任何音效開關（政策擋下時於首次互動自動解除靜音）。
   v52 新增：明確設定 muted + playsinline + preload，並在必要時主動 load()，
   解決行動瀏覽器「非靜音自動播放被政策擋下 → 影片完全不啟動」的問題。 */
(function(){
  "use strict";
  var v = document.getElementById("ecardVideo");
  if(!v) return;

  /* v52：強化初始播放。行動瀏覽器（iOS/Android）即使有 autoplay 屬性，仍可能因
     「非靜音自動播放」政策而完全不啟動；因此明確設定 playsinline + preload，
     並在尚未開始載入時主動 load()，確保影片一定會開始下載與播放。
     音效維持 v51 的「預設開啟」：由 play() 內的 sound() 解除靜音；
     若政策擋下則自動退回靜音續播，並於首次互動自動開聲（頁面不提供任何音效開關）。 */
  try{
    v.playsInline = true;
    v.setAttribute("playsinline","");
    v.setAttribute("webkit-playsinline","");
    v.preload = "auto";
    if(!v.getAttribute("src") && !v.querySelector("source")){ v.setAttribute("src","media/ecard-video.mp4"); }
    if(v.readyState === 0){ v.load(); }
  }catch(e){}

  var soundBlocked = false;   // 被自動播放政策擋下時先靜音續播，首次互動再自動開聲
  var unlocked = false;

  function sound(){
    try{
      v.muted = false;
      v.defaultMuted = false;
      v.removeAttribute("muted");
      if(!v.volume){ v.volume = 1; }
    }catch(e){}
  }

  // 唯一的播放入口：永遠嘗試播放；play() 被拒也絕不讓影片就此停下
  function play(){
    if(!soundBlocked){ sound(); }
    if(v.ended){ try{ v.currentTime = 0; }catch(e){} }
    var p = v.play();
    if(p && typeof p.catch === "function"){
      p.catch(function(){
        if(unlocked){ return; }        // 已互動過仍被擋 → 交由看門狗持續重試
        soundBlocked = true;           // 自動播放政策擋下 → 先靜音讓畫面持續運轉
        try{ v.muted = true; }catch(e){}
        var p2 = v.play();
        if(p2 && typeof p2.catch === "function"){ p2.catch(function(){}); }
      });
    }
  }
  function resume(){ if(document.hidden){ return; } if(v.ended || v.paused){ play(); } }

  // 1) 任何「被暫停／卡住」的來源 → 立刻恢復（暫停、停頓、緩衝、錯誤皆涵蓋）
  ["pause","stalled","waiting","suspend","emptied","abort"].forEach(function(ev){
    v.addEventListener(ev, function(){ window.setTimeout(resume, 0); });
  });
  v.addEventListener("ended", function(){ try{ v.currentTime = 0; }catch(e){} play(); });
  v.addEventListener("error", function(){ window.setTimeout(resume, 150); }, true);

  // 2) 載入就緒即確保播放
  ["loadedmetadata","loadeddata","canplay","canplaythrough","playing","progress"].forEach(function(ev){
    v.addEventListener(ev, function(){ if(v.paused){ play(); } });
  });

  // 3) 點擊畫面任何一處都絕不暫停影片（capture：先於任何其他處理器）
  ["click","pointerdown","mousedown","touchstart","touchend","dblclick"].forEach(function(t){
    document.addEventListener(t, function(){ window.setTimeout(resume, 0); }, true);
  });
  document.addEventListener("keydown", function(){ window.setTimeout(resume, 0); }, true);

  // 4) 分頁／視窗切換後回復時立即續播
  document.addEventListener("visibilitychange", function(){ if(!document.hidden){ resume(); } });
  window.addEventListener("focus", resume);
  window.addEventListener("pageshow", resume);
  window.addEventListener("scroll", function(){ window.setTimeout(resume, 0); }, {passive:true});

  // 5) 首次任何互動即自動解除靜音（不是開關；頁面上不會有任何音效控制）
  function unlock(){
    if(unlocked) return;
    unlocked = true;
    soundBlocked = false;
    sound();
    var p = v.play();
    if(p && typeof p.catch === "function"){ p.catch(function(){}); }
  }
  ["pointerdown","mousedown","touchstart","keydown","wheel"].forEach(function(t){
    document.addEventListener(t, unlock, {capture:true, passive:true});
  });
  window.addEventListener("scroll", unlock, {passive:true});

  // 6) 硬性看門狗：每 400ms 檢查一次，只要該在播放卻停了就重啟（最終保底）
  var lastT = -1, frozen = 0;
  window.setInterval(function(){
    if(document.hidden){ return; }
    if(v.ended){ try{ v.currentTime = 0; }catch(e){} play(); return; }
    if(v.paused){ play(); return; }
    // v52：播放中但時間完全沒有前進（解碼／緩衝卡死）→ 強制重新載入並續播
    if(v.currentTime === lastT){ frozen++; } else { frozen = 0; }
    lastT = v.currentTime;
    if(frozen >= 8){ frozen = 0; try{ v.load(); }catch(e){} play(); }
  }, 400);

  play();
})();
</script>
</body>
</html>
